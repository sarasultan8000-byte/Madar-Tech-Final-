services:
  - type: web
    name: madar-tech
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD_SALT
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
    disk:
      name: madar-tech-data
      mountPath: /var/data
      sizeGB: 1
